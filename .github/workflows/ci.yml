name: PCMS-fhe

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    name: Build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-12 g++-12 clang-15

    - name: Compile with Make
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          export CC=gcc-12
          export CXX=g++-12
        else
          export CC=clang-15
          export CXX=clang++-15
        fi
        
        export BUILD_TYPE=${{ matrix.build_type }}
        
        make all -j$(nproc)
